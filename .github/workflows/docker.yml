# 每次推送：构建 Docker 镜像，在里面跑不需要账号的测试，再试着启动、停止一次。
# 只用示例配置，不需要任何密码，也不花 token。
name: Docker build & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Prepare data folder (example config only, no secrets)
        run: |
          mkdir data
          cp mail_digest/config.example.toml data/config.toml
          echo "PUID=$(id -u)" >> "$GITHUB_ENV"
          echo "PGID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build

      - name: Tests inside the container (format, data folder, scheduler)
        run: docker compose run --rm assistant python3 tests/run_tests.py --format-only

      - name: Setup wizard + course list tests
        run: docker compose run --rm assistant python3 tests/test_setup.py

      - name: Timetable
        run: docker compose run --rm assistant python3 scheduler.py --list

      - name: Start, check it runs, stop
        run: |
          docker compose up -d
          sleep 15
          docker compose logs
          docker compose logs | grep -q "调度器启动"
          test -f data/scheduler_state.json        # 能往 data/ 里写文件（权限正确）
          start=$(date +%s)
          docker compose down
          took=$(( $(date +%s) - start ))
          echo "stopping took ${took}s"
          test "$took" -lt 10                      # 收到停止信号后马上停下
