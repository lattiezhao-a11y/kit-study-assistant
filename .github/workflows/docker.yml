# On every push: build the Docker image, run the tests that need no account inside it, then start and stop it once.
# Uses the example config only: no passwords, no tokens.
name: Docker build & tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Prepare data folder (example config only, no secrets)
        run: |
          mkdir data
          cp mail_digest/config.example.toml data/config.toml
          echo "PUID=$(id -u)" >> "$GITHUB_ENV"
          echo "PGID=$(id -g)" >> "$GITHUB_ENV"

      - name: Build image
        run: docker compose build

      - name: Tests inside the container (format, data folder, scheduler)
        run: docker compose run --rm assistant python3 tests/run_tests.py --format-only

      - name: Setup wizard + course list tests
        run: docker compose run --rm assistant python3 tests/test_wizard.py

      - name: Timetable
        run: docker compose run --rm assistant python3 scheduler.py --list

      - name: Start, check it runs, stop
        run: |
          docker compose up -d
          sleep 15
          docker compose logs
          docker compose logs | grep -q "Scheduler started"
          test -f data/scheduler_state.json        # can write to data/ (permissions are right)
          start=$(date +%s)
          docker compose down
          took=$(( $(date +%s) - start ))
          echo "stopping took ${took}s"
          test "$took" -lt 10                      # stops right after the stop signal
