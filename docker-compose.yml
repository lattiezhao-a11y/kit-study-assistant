# Start: docker compose up -d --build      Logs: docker compose logs -f
# All data lives in the data/ folder next to this file: config.toml, .env and the *.json files the program creates
services:
  assistant:
    build: .
    container_name: kit-study-assistant
    restart: unless-stopped
    init: true                       # lets docker stop shut down right away
    user: "${PUID:-1000}:${PGID:-1000}"   # run as the owner of the data/ folder (id -u / id -g)
    volumes:
      - ./data:/data
    # Reminders only, no chat bot: remove the # in front of the next line
    # command: ["python3", "scheduler.py", "--no-bot"]
