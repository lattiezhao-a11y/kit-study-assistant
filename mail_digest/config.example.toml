# Copy this file to config.toml and edit it. Store passwords in .env, not here.

[general]
language = "zh"          # Interface language: zh (Chinese) or de (German). It can also be changed with /language in Telegram.
since_days = 1          # Number of days to look back on the first run, when no progress exists yet.
max_per_account = 100    # Maximum number of messages to process from each mailbox per run.
snippet_chars = 300      # Maximum number of body characters from each email sent to the AI.
send_when_empty = false  # Send a “no new email today” message even when there is no new email.

[llm]
enabled = true
base_url = "https://api.deepseek.com"   # Any service compatible with the OpenAI API can be used.
model = "deepseek-flash"                # Use deepseek-flash for every task.
api_key_env = "DEEPSEEK_API_KEY"
batch_size = 40                         # Maximum number of emails classified in one request.
# Tell the AI who you are and what matters to you. Shorter text uses fewer tokens.
about_me = "I am a student at KIT (Karlsruhe Institute of Technology). Emails about courses, exams, homework deadlines, re-registration fees, visa and residence permit, banking and housing matter to me."
# Always classify these emails as “ignored”. They remain in the mailbox and are listed at the end of the digest.
always_ignore = [
  "Account security alerts: new device sign-ins, password changes, 2-step verification, security warnings (Google, Microsoft or any other service)",
  "Verification codes, sign-in links, email address confirmations (any app or website)",
  "Subscriptions: newsletters, marketing, subscription confirmations, renewal reminders. Note: course, ILIAS, KIT and department mailing lists are not subscriptions; judge them normally",
]

[job]
# Set this to true and fill in profile when you start job hunting. Set it back to false after starting a job to ignore recruiting emails.
job_search = false
profile = "Werkstudent"   # Add your field, preferred location or remote work, and skills later.

[safety_net]
# Optional safeguard: after AI classification, messages from these senders are at least “action required”.
# This only raises priority, never lowers it. Matching is case-insensitive and checks whether the sender name or address contains the value.
# Add senders here if the AI misses them after you have used the assistant for a while.
always_important_senders = [
  # "mueller@kit.edu",
]

[telegram]
bot_token_env = "TELEGRAM_BOT_TOKEN"
chat_id_env = "TELEGRAM_CHAT_ID"

[[accounts]]
name = "KIT"
host = "imap.kit.edu"
port = 993
user = "uxxxx"               # Your KIT account (starting with u); alternatively try "uxxxx@student.kit.edu".
password_env = "KIT_PASSWORD"
folder = "INBOX"
llm = true                   # false means messages from this mailbox are not sent to the AI and are shown as “unclassified” in the digest.

[[accounts]]
name = "Gmail"
host = "imap.gmail.com"
port = 993
user = "your.address@gmail.com"
password_env = "GMAIL_APP_PASSWORD"   # An app password, not your Gmail sign-in password.
folder = "INBOX"
llm = true
# Emails forwarded automatically from Hotmail to Gmail are processed here as well.

# ---------------------------------------------------------------- ILIAS deadlines
[ilias]
user = "uxxxx"                    # Your KIT account, the same one used for KIT email.
password_env = "KIT_PASSWORD"     # The password for your KIT email account.
ical_url_env = "ILIAS_ICAL_URL"   # ILIAS calendar subscription URL, stored in .env.
quiet_hours = [0, 7]              # Do not send three-day or one-day reminders from 00:00 to 07:00; three-hour reminders are still sent.
# Do not inspect these folders, such as old exams or course materials with no deadlines.
skip_folders = 'Altklausur|Vorlesungsfolien|Lecture \(slides|Related Work|Code from Lecture|Vorlesungsmaterialien|Vorlesungswerbung'

# Add one [[ilias.courses]] block for each course this semester.
# name = a short name you choose, which the bot uses in replies.
# crs = the number after goto.php/crs/ in the course URL.
# groups = your Tutorium; the number after goto.php/grp/ in its URL. This is optional.
# read_pages = false: do not read page text, only new files. Use this for courses without weekly assignments.
[[ilias.courses]]
name = "Lineare Algebra"
crs = 1234567
groups = [7654321]

[[ilias.courses]]
name = "Seminar"
crs = 2345678
read_pages = false

# Manually added deadlines for ones missing from or incorrect in ILIAS. Use "" for time if it is unknown.
[[ilias.manual]]
course = "Seminar"
title = "Ausarbeitung abgeben"
date = "2026-12-04"
time = ""
